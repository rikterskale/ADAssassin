[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adassassin"
version = "1.0.0"
description = "Vendor-grade web console for authorized Active Directory red team operations"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "LicenseRef-Proprietary"
authors = [{ name = "Rikter Skale" }]
keywords = ["active-directory", "red-team", "web-console"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    # Install the engine's capability dependencies with the console so every
    # catalog entry can report its true readiness immediately after install.
    "adaf-attack[kerberos,certipy] @ git+https://github.com/rikterskale/ADAF-ATTACK.git@df92b617ad7d2ca3603408d59fcef50338e50bab",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "httpx>=0.28",
    "ruff>=0.6.0",
]

[project.scripts]
adassassin = "adassassin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adassassin = ["data/*.json", "webapp/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Optional engine imports and offline fallbacks intentionally catch broadly.
ignore = ["BLE001", "S110", "S112", "FURB162"]

[tool.pytest.ini_options]
# Silence third-party deprecation noise (FastAPI on 3.14, ldap3/pyasn1 in the
# pinned engine) so the suite output stays clean. App-owned warnings still show.
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    "ignore:tagMap is deprecated:DeprecationWarning",
    "ignore:typeMap is deprecated:DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
