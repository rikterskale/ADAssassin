name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.label }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: ubuntu, python-version: "3.11" }
          - { os: ubuntu-latest, label: ubuntu, python-version: "3.12" }
          - { os: ubuntu-latest, label: ubuntu, python-version: "3.13" }
          - { os: ubuntu-latest, label: ubuntu, python-version: "3.14" }
          - { os: windows-latest, label: windows, python-version: "3.12" }
          - { os: macos-latest, label: macos, python-version: "3.12" }

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (editable + dev)
        run: python -m pip install -U pip setuptools wheel; python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Packaging smoke
        run: |
          python -m build
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', wheels[0]])"
          python -c "from adassassin import __version__, ENGINE_PIN, ENGINE_COMMIT; assert __version__ == '1.0.0'; assert ENGINE_PIN == '0.10.1'"
          python -c "from adassassin.catalog import static_catalog; c=static_catalog(); assert c['count'] == 92"
          python -c "from adassassin.engine import probe; p=probe(); assert p['available'], p; assert p['version'] == '0.10.1', p; assert p['capability_count'] >= 90, p"
          adassassin --version

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: python -m pip install -U pip "ruff>=0.6.0"

      - name: Ruff check
        run: python -m ruff check src tests

  web:
    name: web tests + build + bundle sync (node${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.19.0", "22.12.0"]
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Type-check the test suite
        run: npm --prefix web run typecheck:test

      - name: Run web unit tests
        run: npm --prefix web test

      - name: Run E2E harness regressions
        run: npm --prefix web run test:e2e-harness

      - name: Build the console bundle
        run: npm --prefix web run build

      - name: Verify the shipped bundle matches web/ source
        run: |
          if [ -n "$(git status --porcelain src/adassassin/webapp)" ]; then
            echo "::error::src/adassassin/webapp is stale. Run 'npm --prefix web run build' and commit the result."
            git status --porcelain src/adassassin/webapp
            exit 1
          fi
          echo "Shipped bundle is in sync with web/ source."

  e2e:
    name: user-journey e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the console (serves the shipped bundle)
        run: |
          python -m pip install -U pip
          python -m pip install -e .

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run the user-readiness journey
        working-directory: web
        run: npm run e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/test-results/e2e-*/
          retention-days: 7
